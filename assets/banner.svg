<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Brain Upgrade: I build AI agents that run in production">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#141d45"/><stop offset="1" stop-color="#0c3350"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/><stop offset="0.33" stop-color="#34A853"/><stop offset="0.66" stop-color="#FBBC05"/><stop offset="1" stop-color="#EA4335"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7aa7ff" stop-opacity="0.35"/><stop offset="1" stop-color="#7aa7ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="985" cy="160" r="120" fill="url(#glow)"/>
  <g fill="none"><path id="e0" d="M985 160 L850 72" stroke="#4285F4" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/></path><path id="e1" d="M985 160 L1120 72" stroke="#EA4335" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/></path><path id="e2" d="M985 160 L850 248" stroke="#34A853" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/></path><path id="e3" d="M985 160 L1120 248" stroke="#FBBC05" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/></path></g>
  <circle r="4.5" fill="#4285F4"><animateMotion dur="2.4s" begin="-0.1s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#e0"/></animateMotion></circle><circle r="4.5" fill="#EA4335"><animateMotion dur="2.4s" begin="-0.7s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#e1"/></animateMotion></circle><circle r="4.5" fill="#34A853"><animateMotion dur="2.4s" begin="-1.3s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#e2"/></animateMotion></circle><circle r="4.5" fill="#FBBC05"><animateMotion dur="2.4s" begin="-1.9s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#e3"/></animateMotion></circle>
  <circle cx="850" cy="72" r="17" fill="#0b1020" stroke="#4285F4" stroke-width="3"/><circle cx="850" cy="72" r="5" fill="#4285F4"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="-0.1s" repeatCount="indefinite"/></circle><circle cx="1120" cy="72" r="17" fill="#0b1020" stroke="#EA4335" stroke-width="3"/><circle cx="1120" cy="72" r="5" fill="#EA4335"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="-0.7s" repeatCount="indefinite"/></circle><circle cx="850" cy="248" r="17" fill="#0b1020" stroke="#34A853" stroke-width="3"/><circle cx="850" cy="248" r="5" fill="#34A853"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="-1.3s" repeatCount="indefinite"/></circle><circle cx="1120" cy="248" r="17" fill="#0b1020" stroke="#FBBC05" stroke-width="3"/><circle cx="1120" cy="248" r="5" fill="#FBBC05"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="-1.9s" repeatCount="indefinite"/></circle>
  <circle cx="985" cy="160" r="30" fill="#0b1020" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="985" cy="160" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"><animate attributeName="r" values="30;46" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite"/></circle>
