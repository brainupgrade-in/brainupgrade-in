  <text x="985" y="212" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ffffff">supervisor</text>
  <text x="850" y="44" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d4ff">planner</text><text x="1120" y="44" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d4ff">tools · MCP</text><text x="850" y="286" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d4ff">memory · RAG</text><text x="1120" y="286" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d4ff">evaluator</text>
  <text x="60" y="68" font-family="Consolas, Menlo, monospace" font-size="15" fill="#7aa7ff" letter-spacing="3">AGENTIC AI</text>
  <text x="60" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Brain Upgrade</text>
  <text x="60" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#c9d4ff">I build AI agents that run in production</text>
  <rect x="60" y="194" width="380" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="238" font-family="Consolas, Menlo, monospace" font-size="17" fill="#9fe0b0">while not done: <tspan fill="#ffffff">plan → act → observe → evaluate</tspan><tspan fill="#9fe0b0"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>▍</tspan></text>
  <text x="60" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#9fb0d9">Rajesh Gheware · LangGraph · MCP · RAG · Evals · Observability</text>
